<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - IoT Control Center</title>
<link rel="stylesheet" href="../css/login.css" />
</head>
<body class="login-page">

  <div class="login-brand">
    <span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>
    IOT CONTROL CENTER
  </div>

  <main class="login-card">
    <div class="login-lock"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <h1>System Access</h1>
    <p class="login-sub">Environmental Monitoring &amp; Device Control</p>

    <div class="login-error" id="login-error" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="field-group">
        <label for="username">Username</label>
        <div class="input-with-icon">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <input type="text" id="username" aria-describedby="login-error" autocapitalize="none" spellcheck="false" name="username" placeholder="Enter your username" autocomplete="username" required />
        </div>
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <div class="input-with-icon has-right-icon">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" id="password" aria-describedby="login-error" name="password" placeholder="Enter your password" autocomplete="current-password" required />
          <button type="button" class="password-toggle" id="toggle-password" aria-pressed="false" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="login-btn" id="login-btn">Login</button>
    </form>

    <p class="login-footer">IoT Monitoring System © 2026</p>
  </main>

<script src="../js/login.js"></script>
</body>
</html>
