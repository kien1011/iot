server.port=${SERVER_PORT:8081}

# MySQL
# Run iot_system_init.sql once before starting the backend.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:iot_system}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.format_sql=true

# JSON / date-time
spring.jackson.serialization.write-dates-as-timestamps=false

# Session-based login. All stored users have the same permissions.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Frontend development origins. The built-in frontend is served by Spring Boot.
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# MQTT
# Mosquitto and Spring Boot run on the same computer, so localhost is the default broker host.
iot.mqtt.broker-uri=tcp://${MQTT_HOST:127.0.0.1}:${MQTT_PORT:1235}
iot.mqtt.client-id=${MQTT_CLIENT_ID:spring-backend-iot}
iot.mqtt.username=${MQTT_USERNAME:nguyentrungkien}
iot.mqtt.password=${MQTT_PASSWORD:b23dccn464}
iot.mqtt.sensor-topic=iot/sensors/data
iot.mqtt.command-topic=iot/devices/command
iot.mqtt.status-topic=iot/devices/status
iot.mqtt.qos=0
iot.mqtt.reconnect-delay-ms=5000

# Device command behavior
iot.device.command-timeout-seconds=5

logging.level.com.ptit.iot=INFO
