# A separate test database only; never point this at the demonstration schema.
spring.datasource.url=${IOT_TEST_DB_URL:jdbc:h2:mem:iot_tests;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${IOT_TEST_DB_USER:sa}
spring.datasource.password=${IOT_TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
logging.level.org.hibernate.SQL=WARN
